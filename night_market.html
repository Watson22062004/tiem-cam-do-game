/* ================= CHIP & ĐIỀU KHIỂN ================= */
let chipId='';
function updateChip(){
  const z=near_;
  if(z){
    if(chipId!==z.id){chip.textContent=clean(z.label);chipId=z.id}
    const cw=cv.clientWidth,ch=cv.clientHeight;chip.style.left=((z.ax-CX)/W*cw)+'px';chip.style.top=(z.ay/H*ch)+'px';chip.classList.add('on');
  }else{chip.classList.remove('on');chipId=''}
}
document.querySelectorAll('.d').forEach(b=>{
  const d=b.dataset.d,on=e=>{e.preventDefault();held[d]=true;b.classList.add('p')},off=e=>{e.preventDefault();held[d]=false;b.classList.remove('p')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
const clean=s=>s.replace(/^\S+\s+/,'');
const act=document.getElementById('act'),acs=document.getElementById('acs'),md=document.getElementById('md'),mt=document.getElementById('mt'),ma=document.getElementById('ma'),mb=document.getElementById('mb');
let modal=false,actId=null;
function invCleanup(){   /* dọn danh sách Kho Đồ khi popup đóng / popup khác mở */
  try{const I=window.__inv;if(I&&typeof I.stop==='function')I.stop()}catch(e){console.error('[Kho Đồ] lỗi khi dọn popup:',e)}
  try{['invl','invd'].forEach(id=>{const l=document.getElementById(id);if(l)l.remove()});mb.classList.remove('inv')}catch(e){console.error('[Kho Đồ] lỗi khi dọn popup:',e)}
}
function closeModal(){invCleanup();modal=false;md.hidden=true}
function openModal(text,btns,kind){
  invCleanup();
  modal=true;for(const k in held)held[k]=false;document.querySelectorAll('.d').forEach(b=>b.classList.remove('p'));
  mt.textContent=text;mb.dataset.k=kind||'';ma.innerHTML='';
  btns.forEach(([label,fn])=>{const b=document.createElement('button');b.className='mbtn';b.textContent=label;b.addEventListener('click',()=>{closeModal();if(fn)fn()});ma.appendChild(b)});
  md.hidden=false;
}
const DEV=()=>openModal('Tính năng đang phát triển.',[['Đóng']]);
/* KHO ĐỒ: mở bằng đúng openModal nội bộ như NPC; không dùng window.openModal */
const INV_ERR='📦 Không đọc được dữ liệu kho';
function invShowError(list,err){
  console.error('[Kho Đồ] lỗi mở/hiển thị Kho Đồ:',err);
  try{list.textContent='';const d=document.createElement('div');d.className='inv-e';d.textContent=INV_ERR;list.appendChild(d)}catch(e){console.error('[Kho Đồ] không thể hiển thị thông báo lỗi:',e)}
}
function openInventory(){
  openModal('📦 KHO ĐỒ',[['Đóng']]);
  let list=null;
  try{
    mb.classList.add('inv');
    list=document.createElement('div');list.id='invl';mb.insertBefore(list,ma);
    const I=window.__inv;
    if(!I||typeof I.start!=='function')throw new Error('Module Kho Đồ chưa được nạp (window.__inv không tồn tại)');
    I.start();
  }catch(e){
    if(list)invShowError(list,e);else console.error('[Kho Đồ] lỗi mở Kho Đồ:',e);
  }
}
/* chi tiết vật phẩm: cũng dùng openModal nội bộ; dữ liệu đọc lại trực tiếp từ G.inv theo chỉ số */
function openInvItem(idx){
  openModal('📦 CHI TIẾT VẬT PHẨM',[['← Kho Đồ',openInventory],['Đóng']]);
  let box=null;
  try{
    mb.classList.add('inv');
    box=document.createElement('div');box.id='invd';mb.insertBefore(box,ma);
    const I=window.__inv;
    if(!I||typeof I.detail!=='function')throw new Error('Module Kho Đồ chưa được nạp (window.__inv.detail không tồn tại)');
    I.detail(box,idx);
  }catch(e){
    if(box)invShowError(box,e);else console.error('[Kho Đồ] lỗi mở chi tiết vật phẩm:',e);
  }
}
mb.addEventListener('click',e=>{
  try{const t=e.target&&e.target.closest?e.target.closest('.inv-t'):null;if(t&&modal)openInvItem(+t.dataset.i)}
  catch(err){console.error('[Kho Đồ] lỗi khi bấm vật phẩm:',err)}
});
mb.addEventListener('keydown',e=>{
  try{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('inv-t')){e.preventDefault();e.stopPropagation();openInvItem(+t.dataset.i)}}
  catch(err){console.error('[Kho Đồ] lỗi khi chọn vật phẩm bằng phím:',err)}
});
const SHOP_FILE = "index.html";
const NIGHT_MARKET_FILE = "night_market.html";
function backToShop(){
  try{if(typeof save==='function')save()}catch(e){}
  try{sessionStorage.setItem("returnFromNightMarket","1")}catch(e){}
  location.href=SHOP_FILE;
}
function talk(n){const d=n.d,line=d.lines[n.li%d.lines.length];n.li++;n.nod=14;openModal(d.name+': “'+line+'”',[['Đóng']])}
function interact(){
  if(modal||!near_)return;
  if(near_.id==='door')openModal('Rời chợ?',[['Ở lại'],['Về',backToShop]],'q');
  else if(near_.id==='inv')openInventory();
  else if(near_.id==='hall')openModal('🌙 Chợ Đêm sẽ mở ở bản cập nhật tiếp theo.',[['Đóng']]);
  else if(near_.npc)talk(near_.npc);
  else DEV();
}
function updateAct(){
  const id=near_?near_.id:'';
  if(id!==actId){actId=id;act.classList.toggle('on',!!near_);act.setAttribute('aria-hidden',near_?'false':'true');act.tabIndex=near_?0:-1;if(near_)acs.textContent=clean(near_.name)}
}
act.addEventListener('pointerdown',e=>{e.preventDefault();act.classList.add('p');interact()});
['pointerup','pointerleave','pointercancel'].forEach(t=>act.addEventListener(t,()=>act.classList.remove('p')));
act.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(modal){if(e.key==='Escape')closeModal();return}
  if(e.key==='e'||e.key==='E'||e.key==='Enter'||e.key===' '){e.preventDefault();interact();return}
  if(KM[e.key]){e.preventDefault();held[KM[e.key]]=true}
});
addEventListener('keyup',e=>{if(KM[e.key])held[KM[e.key]]=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false});

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(3,(t-lt)/16.67||1);lt=t;tick++;
  update(dt);render(t);updateChip();updateAct();
}
if(document.fonts&&document.fonts.load)document.fonts.load('700 12px "Be Vietnam Pro"').then(()=>{signSprite=textPx('CHỢ ĐÊM',12,'#ffe9b0','#2a0c08');scene=buildScene()}).catch(()=>{});
requestAnimationFrame(frame);
})();
</script>

      d.inv.forEach((it,i)=>{
        if(!it||typeof it!=='object'){console.error('[Kho Đồ] G.inv['+i+'] không hợp lệ:',it);return}
        if(!owned(it))return;                                   /* lọc đồ khách gửi sửa */
        try{tiles.push(tile(it,i))}
        catch(e){console.error('[Kho Đồ] lỗi render vật phẩm G.inv['+i+']:',e,it)}
      });
      if(!tiles.length){list.appendChild(el('div','inv-e','📦 Kho trống'));return}
      list.appendChild(el('div','inv-h',tiles.length+' món · chạm để xem chi tiết'));
      const g=el('div','inv-g');tiles.forEach(t=>g.appendChild(t));list.appendChild(g);
      list.scrollTop=keep;
    }catch(e){
      console.error('[Kho Đồ] lỗi render Kho Đồ:',e);
      try{list.textContent='';list.appendChild(el('div','inv-e','📦 Không đọc được dữ liệu kho'))}catch(e2){console.error('[Kho Đồ] không thể hiển thị thông báo lỗi:',e2)}
    }
  }
  function detail(box,idx){
    const d=readSave();
    if(d.err){box.appendChild(el('div','inv-e','📦 Không đọc được dữ liệu kho'));return}
    if(d.none){box.appendChild(el('div','inv-e','📦 Chưa có dữ liệu từ Tiệm'));return}
    const it=d.inv[idx];
    if(!owned(it)){console.error('[Kho Đồ] G.inv['+idx+'] không còn là vật phẩm của người chơi:',it);box.appendChild(el('div','inv-e','📦 Vật phẩm không còn trong kho'));return}
    const h=el('div','inv-dh'),hb=el('div','inv-b');
    hb.appendChild(el('div','inv-dn',String(it.name==null?'?':it.name)));hb.appendChild(badge(it));
    h.appendChild(iconBox(it,'inv-di'));h.appendChild(hb);box.appendChild(h);
    const cond=Math.max(0,Math.min(100,+it.cond||0)),rp=it.repairs|0,sold=it.price||r10(vis(it,d.mk)*1.15);
    const g=el('div','inv-dl');
    const add=(k,v,extra)=>{g.appendChild(el('div','inv-k',k));const c=el('div','inv-v');if(typeof v==='string')c.textContent=v;else c.appendChild(v);if(extra)c.appendChild(extra);g.appendChild(c)};
    const bar=el('div','inv-bar'),fill=el('i');fill.style.width=cond+'%';fill.style.background=cond>=70?'#3a9a4a':cond>=40?'#d0a020':'#c03a2a';bar.appendChild(fill);
    add('Tình trạng',cond+'%',bar);
    add('Giá vốn',fm(+it.cost||0));
    const sv=el('span',null,fm(sold));if(!it.price&&!it.known){sv.appendChild(document.createTextNode(' '));sv.appendChild(el('small',null,'(ước tính)'))}
    add('Giá bán',sv);
    add('Số lần sửa',rp===0?'Chưa sửa':rp+' lần');
    box.appendChild(g);
  }
  /* API cho popup Kho Đồ (mở bằng openModal nội bộ của game, xem openInventory ở trên) */
  window.__inv={
    start(){lastSig=null;render(true);clearInterval(timer);timer=setInterval(()=>render(false),1000)},   /* tự cập nhật khi Tiệm đổi dữ liệu */
    stop(){clearInterval(timer);timer=0},
    detail
  };
  addEventListener('storage',e=>{if(e.key===SAVE_KEY||e.key===TS_KEY||e.key===null)render(false)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)render(false)});
})();
</script>
<script>
/* ===== HUD: đọc cùng save của Tiệm (localStorage "tcd1"), cập nhật thời gian thực — chỉ ĐỌC, không ghi ===== */
(function(){
  const KEY='tcd1',$=id=>document.getElementById(id);
  const E={money:$('hm'),rep:$('hr'),day:$('hd'),inv:$('hv')};
  let last=null,first=true;
  const fmMoney=n=>Math.round(n).toLocaleString('vi-VN')+'k';
  function parse(raw){
    try{
      const d=JSON.parse(raw),g=d&&d.G;if(!g)return null;
      const money=Number(g.money),rep=Number(g.rep),day=Number(g.day);
      if(!isFinite(money)||!isFinite(day))return null;
      return{money,rep:isFinite(rep)?rep:0,day,inv:Array.isArray(g.inv)?g.inv.length:0};
    }catch(e){return null}
  }
  function put(k,text){
    const n=E[k];if(!n||n.textContent===text)return;
    const had=n.textContent!=='—';n.textContent=text;
    if(had){const p=n.parentNode;p.classList.remove('up');void p.offsetWidth;p.classList.add('up');setTimeout(()=>p.classList.remove('up'),750)}
  }
  function render(s){
    put('money',fmMoney(s.money));
    put('rep',(s.rep/20).toFixed(1).replace('.',','));
    put('day','Ngày '+s.day);
    put('inv',s.inv+' món');
  }
  function sync(){
    let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){return}
    if(raw===last)return;last=raw;
    if(raw==null)return;               // chưa có save: giữ nguyên "—"
    const s=parse(raw);if(s)render(s);
  }
  sync();
  addEventListener('storage',e=>{if(e.key===KEY||e.key===null)sync()});   // Tiệm mở ở tab khác ghi save -> cập nhật ngay
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
  addEventListener('focus',sync);addEventListener('pageshow',sync);
  setInterval(sync,1000);                                                  // đọc định kỳ
  window.__hudSync=sync;
})();
</script>
