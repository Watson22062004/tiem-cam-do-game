@keyframes bob{50%{margin-top:calc(-1*var(--u))}}
/* D-pad */
#dp{position:fixed;left:calc(env(safe-area-inset-left) + 20px);bottom:calc(env(safe-area-inset-bottom) + 22px);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:14px}
.d{position:relative;padding:0;display:flex;align-items:center;justify-content:center;touch-action:none;
  background:
   linear-gradient(var(--g2),var(--g2)) left calc(2*var(--u)) top calc(2*var(--u))/var(--u) var(--u) no-repeat,
   linear-gradient(var(--g2),var(--g2)) right calc(2*var(--u)) top calc(2*var(--u))/var(--u) var(--u) no-repeat,
   linear-gradient(var(--g4),var(--g4)) left calc(2*var(--u)) bottom calc(2*var(--u))/var(--u) var(--u) no-repeat,
   linear-gradient(var(--g4),var(--g4)) right calc(2*var(--u)) bottom calc(2*var(--u))/var(--u) var(--u) no-repeat,
   repeating-linear-gradient(0deg,#0000 0 6px,rgba(0,0,0,.14) 6px 9px),var(--w2)}
.d.p{--hi:var(--w3);--lo:var(--w1);--w2:#8a5a30;transform:translateY(var(--u))}
.d[data-d=up]{grid-column:2;grid-row:1}.d[data-d=left]{grid-column:1;grid-row:2}.d[data-d=down]{grid-column:2;grid-row:2}.d[data-d=right]{grid-column:3;grid-row:2}
.d[data-d=left] .ar{transform:rotate(-90deg)}.d[data-d=right] .ar{transform:rotate(90deg)}.d[data-d=down] .ar{transform:rotate(180deg)}
/* nút tương tác: ẩn khi không ở gần vật thể, fade-in khi tới gần */
#act{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s steps(4,end),visibility 0s linear .22s;position:fixed;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 22px);min-width:150px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2*var(--u));padding:calc(2*var(--u)) calc(4*var(--u));touch-action:none;
  color:#8a7858;--g3:#5a4a32;--hi:#4a3a2a;--lo:#150d08;background:repeating-linear-gradient(0deg,#0000 0 6px,rgba(0,0,0,.2) 6px 9px),#2a1c14}
#act .al{display:flex;align-items:center;gap:calc(2*var(--u));font-weight:700;font-size:12px;letter-spacing:.06em}
#act .as{display:flex;align-items:center;gap:calc(2*var(--u));font-weight:700;font-size:15px;min-height:calc(11*var(--u)/2);white-space:nowrap}
#act.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s steps(4,end),visibility 0s;color:var(--g1);--g3:var(--g2);--hi:#c08a50;--lo:#4a2a10;text-shadow:2px 2px 0 var(--ol);background:repeating-linear-gradient(0deg,#0000 0 6px,rgba(0,0,0,.14) 6px 9px),#8a5a2c;animation:pulse 1s steps(1) infinite}
@keyframes pulse{50%{--g3:#fff0b0}}
#act.p{transform:translateY(var(--u));--hi:var(--lo)}
/* popup */
#md{position:fixed;left:0;top:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:center;background:conic-gradient(#0000 25%,rgba(0,0,0,.28) 0 50%,#0000 0 75%,rgba(0,0,0,.28) 0) 0 0/6px 6px,rgba(5,3,10,.5)}
#md[hidden]{display:none}
#mb{min-width:240px;max-width:80vw;padding:calc(7*var(--u)) calc(9*var(--u)) calc(6*var(--u));text-align:center;color:var(--g1);--g3:var(--g2);--hi:#5a4a7a;--lo:#120a1e;background:repeating-linear-gradient(0deg,#0000 0 6px,rgba(0,0,0,.16) 6px 9px),#2a1a3a;box-shadow:var(--ring),calc(3*var(--u)) calc(3*var(--u)) 0 calc(2*var(--u)) rgba(0,0,0,.45),inset var(--u) var(--u) 0 0 var(--hi),inset calc(-1*var(--u)) calc(-1*var(--u)) 0 0 var(--lo)}
#mb .mi{display:block;margin:0 auto calc(4*var(--u))}
#mt{font-weight:700;font-size:clamp(14px,3vw,18px);line-height:1.45;text-shadow:2px 2px 0 var(--ol)}
#ma{display:flex;gap:calc(6*var(--u));justify-content:center;margin-top:calc(6*var(--u))}
.mbtn{position:relative;font-weight:700;font-size:15px;color:var(--g1);text-shadow:2px 2px 0 var(--ol);padding:calc(2*var(--u)) calc(6*var(--u)) calc(2*var(--u)) calc(10*var(--u));background:repeating-linear-gradient(0deg,#0000 0 6px,rgba(0,0,0,.14) 6px 9px),var(--w2)}
.mbtn::before{content:"";position:absolute;left:calc(2*var(--u));top:50%;margin-top:calc(-4.5*var(--u));display:none;image-rendering:pixelated;background-size:100% 100%}
.mbtn:hover::before,.mbtn:focus-visible::before,.mbtn:first-child::before{display:block}
#ma:hover .mbtn:first-child:not(:hover)::before{display:none}
.mbtn:hover{--w2:#8a5a30}
.mbtn:active{--hi:var(--w3);--lo:var(--w1);transform:translateY(var(--u))}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="320" height="180"></canvas><div id="chip"></div></div>
<div id="dp">
  <button class="d" data-d="up" aria-label="Lên"><i class="ic ar"></i></button>
  <button class="d" data-d="left" aria-label="Trái"><i class="ic ar"></i></button>
  <button class="d" data-d="down" aria-label="Xuống"><i class="ic ar"></i></button>
  <button class="d" data-d="right" aria-label="Phải"><i class="ic ar"></i></button>
</div>
<button id="act" tabindex="-1" aria-hidden="true"><span class="al"><i class="ic hand"></i>Tương tác</span><span class="as"><b id="acs"></b></span></button>
<div id="md" hidden><div id="mb"><i class="ic mi"></i><div id="mt"></div><div id="ma"></div></div></div>
<script>
(()=>{
const W=320,H=180,WORLD_WIDTH=1200,cv=document.getElementById('c'),g=cv.getContext('2d'),chip=document.getElementById('chip');
g.imageSmoothingEnabled=false;
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c.getContext('2d')};
const R=(c,col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const hash=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`};
function box(c,x,y,w,h,base,dark,light,line){if(line)R(c,line,x-1,y-1,w+2,h+2);R(c,base,x,y,w,h);if(light){R(c,light,x,y,w,1);R(c,light,x,y,1,h)}if(dark){R(c,dark,x,y+h-1,w,1);R(c,dark,x+w-1,y,1,h)}}
/* ===== PIXEL HELPERS: dither Bayer, elip/đường thẳng không khử răng cưa ===== */
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAY[((y&3)<<2)|(x&3)];
function dith(c,col,x,y,w,h,d){x=Math.round(x);y=Math.round(y);c.fillStyle=col;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(bay(x+i,y+j)<d)c.fillRect(x+i,y+j,1,1)}
function pell(c,x,y,rx,ry,col,d){x=Math.round(x);y=Math.round(y);ry=Math.max(ry,.5);c.fillStyle=col;const n=Math.floor(ry);for(let j=-n;j<=n;j++){const h=Math.floor(rx*Math.sqrt(Math.max(0,1-j*j/(ry*ry)))+.5);if(d==null)c.fillRect(x-h,y+j,h*2+1,1);else for(let i=-h;i<=h;i++)if(bay(x+i,y+j)<d)c.fillRect(x+i,y+j,1,1)}}
function disc(c,x,y,r,col){pell(c,x,y,r,r,col)}
function pline(c,col,x0,y0,x1,y1,t=1){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);c.fillStyle=col;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let k=0;k<800;k++){c.fillRect(x0,y0,t,t);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function sag(c,col,x0,y0,x1,y1,s){let px=x0,py=y0;const n=Math.max(1,Math.abs(x1-x0));for(let i=1;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t+s*4*t*(1-t);pline(c,col,px,py,x,y);px=Math.round(x);py=Math.round(y)}}
function glow(c,x,y,r,rgb,a,sy=1){if(a<=.01)return;[[1,.5,.5],[.62,null,.3],[.3,null,.35]].forEach(([k,d,m])=>pell(c,x,y,r*k,r*k*sy,`rgba(${rgb},${Math.min(1,a*m)})`,d))}
function textPx(txt,px,fill,line){const m=mkc(240,26);m.font=`700 ${px}px "Be Vietnam Pro",sans-serif`;m.textBaseline='top';const w=Math.max(1,Math.ceil(m.measureText(txt).width)+2);m.fillStyle='#000';m.fillText(txt,1,4);const d=m.getImageData(0,0,w,26).data,o=mkc(w+2,28);
  for(let y=0;y<26;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>110)R(o,line,x+1,y+1,1,1);
  for(let y=0;y<26;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>110)R(o,fill,x,y,1,1);return o.canvas}

/* ================= ĐỒ VẬT (vẽ tay bằng ô vuông) ================= */
function radio(c,x,y){
  R(c,'#140e18',x-1,y+2,32,22);box(c,x,y+3,30,20,'#8a5a2a','#5a3818','#c08040');
  R(c,'#c8ccd8',x+25,y-10,1,13);R(c,'#8a8ea0',x+26,y-10,1,13);R(c,'#fff',x+24,y-11,3,2);
  R(c,'#2a1a10',x+6,y,18,2);R(c,'#2a1a10',x+6,y,2,4);R(c,'#2a1a10',x+22,y,2,4);
  R(c,'#140e18',x+2,y+6,15,15);R(c,'#d2c090',x+3,y+7,13,13);
  for(let gy=0;gy<6;gy++)for(let gx=0;gx<6;gx++)R(c,'#6a5634',x+4+gx*2,y+8+gy*2,1,1);
  R(c,'#140e18',x+19,y+6,9,6);R(c,'#eadfb6',x+20,y+7,7,4);R(c,'#c33',x+23,y+7,1,4);R(c,'#7a6a3a',x+20,y+9,7,1);
  [[19,14],[24,14]].forEach(([a,b])=>{R(c,'#140e18',x+a-1,y+b-1,5,5);R(c,'#d9a84a',x+a,y+b,3,3);R(c,'#fff0b0',x+a,y+b,1,1)});
  R(c,'#3a2410',x+3,y+22,4,2);R(c,'#3a2410',x+23,y+22,4,2);
}
function camera(c,x,y){
  R(c,'#140e18',x-1,y+2,29,21);box(c,x,y+3,27,19,'#2c2e38','#16171e','#4a4e5c');
  R(c,'#b8bcc8',x,y+3,27,5);R(c,'#e8ecf4',x,y+3,27,1);R(c,'#8a8ea0',x,y+7,27,1);
  R(c,'#c33',x+20,y+1,4,2);R(c,'#e8ecf4',x+3,y,5,3);R(c,'#8a8ea0',x+3,y+2,5,1);R(c,'#16171e',x+11,y+1,6,2);
  disc(c,x+13.5,y+15,8,'#0e0e14');disc(c,x+13.5,y+15,6.5,'#3a4668');disc(c,x+13.5,y+15,4.5,'#1a2038');disc(c,x+13.5,y+15,3,'#4a7ab8');
  R(c,'#cfe8ff',x+11,y+12,2,2);R(c,'#fff',x+11,y+12,1,1);
  R(c,'#3a2a22',x,y+9,3,12);R(c,'#3a2a22',x+24,y+9,3,12);
}
function lamp(c,x,y){R(c,'#140e18',x-1,y+13,12,4);R(c,'#a8822a',x,y+14,10,2);R(c,'#7a5a1a',x+4,y+8,2,6);R(c,'#cfe4ec',x+1,y,8,9);R(c,'#fff4b0',x+3,y+2,4,6);R(c,'#ffd35a',x+4,y+3,2,4);R(c,'#a8822a',x+1,y-1,8,2)}
function clock(c,x,y){disc(c,x+7,y+7,8,'#140e18');disc(c,x+7,y+7,7,'#c9a050');disc(c,x+7,y+7,5.5,'#eadfb6');R(c,'#222',x+7,y+3,1,5);R(c,'#222',x+7,y+7,3,1);R(c,'#b8352b',x+1,y-3,3,3);R(c,'#b8352b',x+10,y-3,3,3);R(c,'#7a5a1a',x+3,y+14,2,2);R(c,'#7a5a1a',x+9,y+14,2,2)}
function tv(c,x,y){R(c,'#140e18',x-1,y-1,24,22);box(c,x,y,22,20,'#7a5230','#4a2e16','#a87040');R(c,'#140e18',x+2,y+2,13,14);R(c,'#8ab4c8',x+3,y+3,11,12);for(let i=0;i<12;i+=2)R(c,'rgba(20,40,60,.25)',x+3,y+3+i,11,1);R(c,'#e8f4ff',x+4,y+4,3,2);R(c,'#d9a84a',x+17,y+4,3,3);R(c,'#d9a84a',x+17,y+10,3,3);R(c,'#3a2410',x+3,y+20,3,2);R(c,'#3a2410',x+16,y+20,3,2)}
function speaker(c,x,y){R(c,'#140e18',x-1,y-1,15,22);box(c,x,y,13,20,'#2a2a32','#16161c','#44444e');disc(c,x+6.5,y+6,3.5,'#111');disc(c,x+6.5,y+6,2,'#3a3a46');disc(c,x+6.5,y+14,4.5,'#111');disc(c,x+6.5,y+14,3,'#3a3a46');R(c,'#8a8a98',x+6,y+14,1,1)}
function books(c,x,y){[['#a8352b',20],['#3a62a0',18],['#caa24a',16],['#4a7a4a',19]].forEach(([col,w],i)=>{R(c,'#140e18',x-1,y-i*5-1,w+2,6);R(c,col,x,y-i*5,w,4);R(c,'rgba(255,255,255,.28)',x,y-i*5,w,1);R(c,'rgba(0,0,0,.3)',x,y-i*5+3,w,1)})}
function cassette(c,x,y){R(c,'#140e18',x-1,y-1,14,10);R(c,'#d9d4c0',x,y,12,8);R(c,'#2a2a30',x+2,y+2,8,3);disc(c,x+4,y+3.5,1.3,'#eee');disc(c,x+8,y+3.5,1.3,'#eee')}

/* ================= NỀN: TRỜI + CHÂN TRỜI ================= */
function moonDraw(c,x,y,r){
  pell(c,x,y,r*3.4,r*3.4,'rgba(150,170,255,.14)',.5);pell(c,x,y,r*2.3,r*2.3,'rgba(190,205,255,.2)',.5);pell(c,x,y,r*1.6,r*1.6,'rgba(220,230,255,.26)');
  for(let d=-r;d<=r;d++){const h=Math.floor(Math.sqrt(r*r-d*d));R(c,'#f8f2d4',x-h,y+d,h*2,1)}
  for(let d=-r;d<=r;d++){const h=Math.floor(Math.sqrt(r*r-d*d)),s=Math.max(0,Math.floor(h*.55-d*.2));R(c,'#d8d0a8',x-h,y+d,Math.min(s,h*2),1)}
  [[-3,-3,3],[3,1,2],[-1,4,2],[4,-4,1.5]].forEach(([a,b,rr])=>disc(c,x+a,y+b,rr,'#cfc79c'));
  R(c,'#fffbe8',x+2,y-r+2,3,1);
}
function buildSky(){
  const c=mkc(352,120);
  for(let y=0;y<120;y+=4)R(c,mix('#060a24','#5a4c8c',Math.pow(y/120,1.5)),0,y,352,4);
  for(let y=0;y<116;y+=4){const nc=mix('#060a24','#5a4c8c',Math.pow((y+4)/120,1.5));for(let x=(y>>2)&1;x<352;x+=2)R(c,nc,x,y+3,1,1)}
  moonDraw(c,222,20,10);return c;
}
function buildSkyline(seed,col,rim,minH,maxH,wp){
  const c=mkc(352,76);let x=-4,i=seed;
  while(x<352){
    const w=12+Math.floor(hash(i,1)*20),h=minH+Math.floor(hash(i,2)*(maxH-minH)),top=76-h;
    R(c,col,x,top,w,h);R(c,rim,x,top,w,1);
    if(hash(i,3)>.6){R(c,col,x-2,top-3,w+4,3);R(c,rim,x-2,top-3,w+4,1);R(c,col,x+w/2-1,top-7,2,4)}
    for(let wy=top+4;wy<74;wy+=6)for(let wx=x+3;wx<x+w-3;wx+=5)if(hash(wx+i,wy)<wp)R(c,hash(wx,wy)>.5?'#f0b050':'#c88a40',wx,wy,2,3);
    x+=w+Math.floor(hash(i,4)*3);i++;
  }
  for(let y=34;y<76;y++)dith(c,'#5a4c8c',0,y,352,1,(y-34)/42*.55);return c;
}

function doorArt(c){
  const x=12,y=62,w=26,h=44;
  R(c,'#140c10',6,56,38,52);box(c,6,57,38,4,'#4a2e1a','#261408','#7a4e2a');
  R(c,'#261408',x-3,y-3,w+6,h+4);R(c,'#6a4424',x-2,y-2,w+4,h+2);
  box(c,x,y,w,h,'#7a4e28','#3a2410','#a87040');
  R(c,'#ffe0a0',x+4,y+3,18,6);R(c,'#f8c070',x+4,y+9,18,5);R(c,'#f0a050',x+4,y+14,18,5);dith(c,'#ffe0a0',x+4,y+8,18,2,.5);dith(c,'#f8c070',x+4,y+13,18,2,.5);
  R(c,'#3a2410',x+12,y+3,2,16);R(c,'#3a2410',x+4,y+10,18,2);R(c,'rgba(255,255,255,.35)',x+5,y+4,5,3);
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){box(c,x+4+i*10,y+23+j*10,8,8,'#6a4220','#3a2410','#8a5a30')}
  R(c,'#e8c060',x+w-6,y+28,2,4);R(c,'#fff0a0',x+w-6,y+28,1,1);
  R(c,'#3a2a2a',x-4,y+h,w+8,2);box(c,x-6,y+h+2,w+12,3,'#6a6478','#3a3648','#8a849a');
  // biển TIỆM: đồng xu cổ
  R(c,'#140c10',x-8,y-18,w+16,12);box(c,x-7,y-17,w+14,10,'#3a2418','#1a0c08','#6a4a2a');R(c,'#c9a050',x-6,y-16,w+12,1);
  disc(c,x+w/2,y-12,4,'#140c10');disc(c,x+w/2,y-12,3.2,'#e8b040');R(c,'#140c10',x+w/2-1,y-13,2,2);R(c,'#fff0a0',x+w/2-2,y-14,2,1);
  R(c,'#c9a050',x-6,y-6,1,3);R(c,'#c9a050',x+w+5,y-6,1,3);
}
/* ================= NỀN: NHÀ, QUẦY, QUẢNG TRƯỜNG, ĐƯỜNG ================= */
const HOUSES=[
  {x:0,w:52,top:44,roof:'flat',wall:'#3b2a32',rc:'#322640',cols:[]},
  {x:52,w:100,top:22,roof:'tile',wall:'#40303a',rc:'#5a2a34',cols:[14,66],balc:1,shut:1,tank:1},
  {x:152,w:110,top:26,roof:'flat',wall:'#383048',rc:'#2a2244',cols:[16,76],ac:1,antenna:1},
  {x:262,w:58,top:44,roof:'tin',wall:'#3e2c2c',rc:'#44566a',cols:[22],chimney:1},

  return s.zone={id:'st'+i,x:s.x-6,w:100,y:106,h:34,label:d?d.icon+' '+d.name.toUpperCase():LBL[s.type],name:d?d.icon+' '+d.name:NAME[s.type],ax:s.x+44,ay:42,npc}});
ZONES.push({id:'door',x:0,w:56,y:108,h:34,label:'🚪 VỀ TIỆM',name:'🚪 Về tiệm',ax:25,ay:40});
ZONES.push({id:'cart0',x:316,w:70,y:106,h:34,label:'🚚 XE HÀNG',name:'🚚 Xe hàng',ax:350,ay:60},{id:'cart1',x:1048,w:76,y:106,h:34,label:'🚚 XE HÀNG',name:'🚚 Xe hàng',ax:1078,ay:60});
ZONES.push({id:'hall',x:540,w:120,y:106,h:56,label:'🌙 CHỢ ĐÊM',name:'🌙 VÀO CHỢ ĐÊM',ax:600,ay:40});

const PLAZA_L=[[600,100,95,.75],[600,60,80,.65],[540,66,50,.55],[660,66,50,.55],[600,84,50,.7],[900,24,60,.5],[1150,20,55,.5],[372,84,30,.4]];

function addLight(x,y,r,a,sy,warm){x=Math.round(x);y=Math.round(y);const ry=r*sy,x0=Math.max(0,Math.floor(x-r)),x1=Math.min(W-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-ry)),y1=Math.min(H-1,Math.ceil(y+ry));
  for(let j=y0;j<=y1;j++){const dy=(j-y)/ry,dy2=dy*dy;for(let i=x0;i<=x1;i++){const dx=(i-x)/r,d2=dx*dx+dy2;if(d2>=1)continue;const f=1-Math.sqrt(d2),v=a*f*(.7*f+.3);lit[j*W+i]+=v;if(warm)wrm[j*W+i]+=v*.2}}}
const SPEED=1.15,LOOK=46; // 1180px / (1.15*60) ≈ 17s đi hết map
function blocked(x,y){if(x<10||x>WORLD_WIDTH-10||y<113||y>176)return true;return SOLID.some(o=>x+5>o.x&&x-5<o.x+o.w&&y>o.y&&y-3<o.y+o.h)}

/* ================= CẬP NHẬT ================= */
function update(dt){
  let ix=(held.right?1:0)-(held.left?1:0),iy=(held.down?1:0)-(held.up?1:0);
  const m=Math.hypot(ix,iy)||1,max=SPEED,ac=1-Math.pow(.0015,dt/16.67*.2);
  const tx=ix/m*max,ty=iy/m*max*.9,k=(ix||iy)?.2:.28;
  P.vx+=(tx-P.vx)*Math.min(1,k*dt);P.vy+=(ty-P.vy)*Math.min(1,k*dt);
  const sp=Math.hypot(P.vx,P.vy);P.moving=sp>.12;
  const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;if(!blocked(nx,P.y))P.x=nx;else P.vx=0;if(!blocked(P.x,ny))P.y=ny;else P.vy=0;
  if(ix||iy){if(Math.abs(ix)>=Math.abs(iy)&&ix)P.dir=ix>0?1:2;else if(iy)P.dir=iy>0?0:3}
  if(P.moving){P.dist+=sp*dt;P.fr=Math.floor(P.dist/5);dustT-=dt;if(dustT<=0){dustT=9;dust.push({x:P.x-P.vx*3,y:P.y-1,vx:-P.vx*.1,life:0});if(dust.length>40)dust.shift()}}else{P.dist=0;P.fr=0}
  blinkT-=dt;if(blinkT<-9)blinkT=150+Math.random()*180;
  let best=null,bd=1e9;ZONES.forEach(z=>{if(P.x>=z.x&&P.x<=z.x+z.w&&P.y>=z.y&&P.y<=z.y+z.h){const d=Math.abs(P.x-(z.x+z.w/2));if(d<bd){bd=d;best=z}}});
  near_=best;
  // khói
  SMOKE.forEach((e,k)=>{if((tick+k*9)%16===0)sm.push({x:e[0]+Math.random()*3,y:e[1],vx:.08+Math.random()*.08,l:0,m:150+Math.random()*60,sz:2+Math.random()*2})});
  for(let i=sm.length-1;i>=0;i--){const s=sm[i];s.l++;s.y-=.2;s.x+=s.vx+Math.sin((s.l+s.x)/20)*.1;if(s.l>s.m)sm.splice(i,1)}
  for(let i=dust.length-1;i>=0;i--){const d=dust[i];d.l++;d.x+=d.vx;d.y-=.05;if(d.l>22)dust.splice(i,1)}
  fly.forEach(o=>{o.p+=.03;o.x+=Math.cos(o.p*.6)*o.s;o.y+=Math.sin(o.p)*o.s*.7;if(o.x<4)o.x=WORLD_WIDTH-4;if(o.x>WORLD_WIDTH-4)o.x=4;if(o.y<58)o.y=58;if(o.y>174)o.y=174});
  clouds.forEach(c=>{c.x+=.04;if(c.x>W+40)c.x=-70});
  // camera: nhìn trước hướng di chuyển, không khoá giữa màn hình
  const fx=P.dir===1?1:P.dir===2?-1:(Math.sign(cam.look)||0);
  const lk=(P.moving&&Math.abs(P.vx)>.15)?Math.sign(P.vx)*LOOK:fx*LOOK*.4;
  cam.look+=(lk-cam.look)*Math.min(1,(P.moving?.03:.015)*dt);
  const tgt=Math.max(0,Math.min(WORLD_WIDTH-W,P.x-W/2+cam.look));
  cam.x+=(tgt-cam.x)*Math.min(1,.1*dt);
}

/* ================= VẼ ================= */
function lanternBody(l,t){
  const ax=l.x,ay=l.door?l.y:lsy(l.x),a=Math.sin(t*.0014+l.ph)*.09,fl=.92+.08*Math.sin(t*.011+l.ph*3);
  g.save();g.translate(Math.round(ax-CX-a*9),ay);if(l.s!==1)g.scale(l.s,l.s);
  R(g,'#2a1810',-1,0,1,7);R(g,'#140c10',-5,6,10,4);R(g,'#c9a050',-4,7,8,2);R(g,'#7a5a1a',-4,8,8,1);
  const rows=[8,12,14,15,16,16,16,16,16,15,14,12,8];
  rows.forEach((w,i)=>{const yy=10+i;R(g,'#6a1410',-w/2-1,yy,w+2,1);R(g,'#c8302a',-w/2,yy,w,1);R(g,'#e84a30',-w/2+2,yy,w-5,1);R(g,`rgba(255,${190*fl|0},90,${.95*fl})`,-w/2+4,yy,w-8,1);R(g,'rgba(255,240,170,.9)',-2,yy,4,1)});
  R(g,'#6a1410',-6,12,1,9);R(g,'#6a1410',0,10,1,13);R(g,'#6a1410',5,12,1,9);R(g,'rgba(255,255,255,.35)',-6,13,2,3);
  R(g,'#140c10',-5,23,10,3);R(g,'#c9a050',-4,23,8,2);
  const sw2=Math.sin(t*.003+l.ph)*1;R(g,'#e8c060',-3+sw2,26,1,5);R(g,'#e8c060',0+sw2,26,1,7);R(g,'#e8c060',3+sw2,26,1,5);R(g,'#b8352b',-1,26,2,2);
  g.restore();
  return {x:ax+Math.sin(a)*(-18)*-1,y:ay+17*l.s,fl};
}
function render(t){
  const cx=CX=Math.round(cam.x),prog=cx/(WORLD_WIDTH-W),skyOff=-8-prog*16;
  const tile=(c,s,y)=>{const o=-(Math.round(s)%352);g.drawImage(c,o,y);g.drawImage(c,o+352,y)};
  g.drawImage(sky.canvas,Math.round(skyOff),0);
  stars.forEach(s=>{const a=.35+.65*Math.max(0,Math.sin(t*.002+s.p));g.fillStyle=`rgba(230,235,255,${a*.9})`;g.fillRect((((s.x-cx*.02)%W+W)%W)|0,s.y|0,1,1)});
  clouds.forEach(c=>{const x=((c.x-cx*.05+70)%(W+110)+(W+110))%(W+110)-70;for(let i=0;i<5;i++)pell(g,x+i*c.w/5,c.y+Math.round(Math.sin(i*1.7)*2),c.w/4,3+i%2*2,'#3a4488',.6);for(let i=0;i<4;i++)pell(g,x+i*c.w/5+4,c.y-3,c.w/6,2,'#8a96d0',.3)});
  tile(far.canvas,cx*.06,38);
  tile(near.canvas,cx*.1,40);
  g.drawImage(scene.canvas,cx,0,W,H,0,0,W,H);
  sm.forEach(s=>{if(s.x<cx-40||s.x>cx+W+40)return;const a=.3*Math.sin(Math.PI*s.l/s.m)*(1-s.l/s.m*.4),z=s.sz+s.l/s.m*13;pell(g,s.x-cx,s.y,z*.6,z*.5,'rgb(170,170,200)',a*1.5)});
  NPCS.forEach(n=>{const nx=n.x-cx;if(nx<-30||nx>W+30)return;
    const dx=P.x-n.x,look=Math.abs(dx)<120&&Math.abs(dx)>6?Math.sign(dx):0,bl=((t+n.id*1300)%3600)<140,nb=n.nod>0?(n.nod>7?1:0):0;if(n.nod>0)n.nod--;
    pell(g,nx,n.y,10,3,'rgba(0,0,0,.42)');drawNPC(g,nx,n.y,n.d.k,t,bl,look,nb)});
  const sx=P.x-cx;
  pell(g,sx-4,P.y+1,15,4,'rgba(0,0,0,.3)',.5);pell(g,sx+(P.dir===1?-2:P.dir===2?2:0),P.y,10,3,'rgba(0,0,0,.42)');
  dust.forEach(d=>{g.fillStyle=`rgba(190,185,210,${.3*(1-d.l/22)})`;const z=1+d.l/8;g.fillRect(d.x-cx-z/2|0,d.y-z|0,z,z)});
  drawPlayer(sx,P.y,P.dir,P.fr,P.moving,t,blinkT<0);
  for(let x=0;x<W;x+=2){const y=lsy(x+cx);R(g,'#150c14',x,y,2,1)}
  // ánh sáng bằng pixel: dither Bayer, không gradient
  lit.fill(0);wrm.fill(0);
  const L=(x,y,r,a,sy=1)=>{const X=x-cx;if(X+r<0||X-r>W)return;addLight(X,y,r,a,sy,true)};
  LANT.forEach(l=>{const o=lanternBodyPos(l,t),f=o.fl;L(o.x,o.y,l.door?44:84,.92*f);L(o.x,Math.min(160,o.y+82),l.door?40:70,.55*f,.4)});
  STALLS.forEach(s=>{const b=near_&&near_===s.zone?.28:0;L(s.x+38,86,58,.78+b);L(s.x+44,116,64,.5+b,.4)});
  L(25,88,48,.85);L(30,114,40,.55,.4);
  CRATES.forEach(dx=>L(290+dx,90,40,.55));
  PLAZA_L.forEach(p=>L(p[0],p[1],p[2],p[3]));L(600,150,100,.3,.4);
  addLight(222+skyOff,16,130,.5,1,false);
  for(let k=0;k*320<WORLD_WIDTH;k++)L(160+k*320,150,80,.18,.5);
  L(P.x,P.y-18,34,.16);
  const A=.85,N=6,ld=lid.data,wd=wid.data;
  for(let y=0;y<H;y++){const tt=y/H,am=tt<.4?.12+.38*(tt/.4):.5+.22*((tt-.4)/.6);for(let x=0;x<W;x++){const i=y*W+x,b=BAY[((y&3)<<2)|(x&3)];let v=am+vig[i]-lit[i];v=v<0?0:v>A?A:v;ld[i*4+3]=Math.round(Math.floor(v/A*N+b)/N*A*255);wd[i*4+3]=Math.round(Math.min(3,Math.floor(wrm[i]/.07+b))*.07*255)}}
  lg.putImageData(lid,0,0);wg.putImageData(wid,0,0);
  g.drawImage(lm,0,0);
  g.save();g.globalCompositeOperation='lighter';g.drawImage(wm,0,0);
  PUD.forEach(([px,py,rx,ry,i])=>{if(i>2)return;const x=px-cx;if(x<-20||x>W+20)return;const s=.5+.5*Math.sin(t*.003+i*2);g.fillStyle=`rgba(255,170,80,${.18+.12*s})`;g.fillRect(x-1,py-1,3,1);g.fillStyle=`rgba(180,200,255,${.12*s})`;g.fillRect(x-8+i*2,py,6,1)});
  g.restore();
  LANT.forEach(l=>{if(l.x<cx-40||l.x>cx+W+40)return;const o=lanternBody(l,t);g.save();g.globalCompositeOperation='lighter';glow(g,l.x-cx,(l.door?l.y:lsy(l.x))+17*l.s,30*l.s,'255,150,60',.3*o.fl);g.restore()});
  g.save();g.globalCompositeOperation='lighter';
  fly.forEach(o=>{if(o.x<cx-8||o.x>cx+W+8)return;const a=.3+.7*Math.max(0,Math.sin(o.p*2)),x=(o.x-cx)|0,y=o.y|0;g.fillStyle=`rgba(200,255,120,${a*.3})`;g.fillRect(x-1,y,4,2);g.fillRect(x,y-1,2,4);g.fillStyle=`rgba(240,255,170,${a})`;g.fillRect(x,y,2,2)});
  g.restore();
  const fgc='#0b1216';
  [300,740,1140].forEach(ox=>{const X=ox-cx;if(X<-40||X>W+40)return;
    for(let i=0;i<7;i++){const a=-1.6+i*.5,sw=Math.sin(t*.0008+i)*1.5,tx=X+Math.cos(a)*26+sw,ty=180+Math.sin(a)*40;pline(g,i%2?'#0b1a1a':'#0e2220',X,176,tx,ty,2);pline(g,'#1c3a34',X+1,176,tx+1,ty-1)}
    R(g,fgc,X-18,172,36,8);R(g,'#1a2428',X-17,172,34,1)});
  [0,520,1000].forEach(ox=>{const X=ox-cx;if(X<-40||X>W+40)return;
    R(g,fgc,X-2,160,22,22);R(g,'#1a2428',X-2,160,22,1);R(g,'#1a2428',X-2,168,22,1);R(g,'#1a2428',X+4,160,1,20)});
}
function lanternBodyPos(l,t){const ay=l.door?l.y:lsy(l.x),a=Math.sin(t*.0014+l.ph)*.09;return{x:l.x-Math.sin(a)*(14*l.s),y:ay+17*l.s,fl:.92+.08*Math.sin(t*.011+l.ph*3)}}

/* ================= CHIP & ĐIỀU KHIỂN ================= */
let chipId='';
function updateChip(){
  const z=near_;
  if(z){
    if(chipId!==z.id){chip.textContent=clean(z.label);chipId=z.id}
    const cw=cv.clientWidth,ch=cv.clientHeight;chip.style.left=((z.ax-CX)/W*cw)+'px';chip.style.top=(z.ay/H*ch)+'px';chip.classList.add('on');
  }else{chip.classList.remove('on');chipId=''}
}
document.querySelectorAll('.d').forEach(b=>{
  const d=b.dataset.d,on=e=>{e.preventDefault();held[d]=true;b.classList.add('p')},off=e=>{e.preventDefault();held[d]=false;b.classList.remove('p')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());
});
const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
const clean=s=>s.replace(/^\S+\s+/,'');
const act=document.getElementById('act'),acs=document.getElementById('acs'),md=document.getElementById('md'),mt=document.getElementById('mt'),ma=document.getElementById('ma'),mb=document.getElementById('mb');
let modal=false,actId=null;
function closeModal(){modal=false;md.hidden=true}
function openModal(text,btns,kind){
  modal=true;for(const k in held)held[k]=false;document.querySelectorAll('.d').forEach(b=>b.classList.remove('p'));
  mt.textContent=text;mb.dataset.k=kind||'';ma.innerHTML='';
  btns.forEach(([label,fn])=>{const b=document.createElement('button');b.className='mbtn';b.textContent=label;b.addEventListener('click',()=>{closeModal();if(fn)fn()});ma.appendChild(b)});
  md.hidden=false;
}
const DEV=()=>openModal('Tính năng đang phát triển.',[['Đóng']]);
const SHOP_FILE = "index.html";
const NIGHT_MARKET_FILE = "night_market.html";
function backToShop(){
  try{if(typeof save==='function')save()}catch(e){}
  location.href=SHOP_FILE;
}
function talk(n){const d=n.d,line=d.lines[n.li%d.lines.length];n.li++;n.nod=14;openModal(d.name+': “'+line+'”',[['Đóng']])}
function interact(){
  if(modal||!near_)return;
  if(near_.id==='door')openModal('Rời chợ?',[['Ở lại'],['Về',backToShop]],'q');
  else if(near_.id==='hall')openModal('🌙 Chợ Đêm sẽ mở ở bản cập nhật tiếp theo.',[['Đóng']]);
  else if(near_.npc)talk(near_.npc);
  else DEV();
}
function updateAct(){
  const id=near_?near_.id:'';
  if(id!==actId){actId=id;act.classList.toggle('on',!!near_);act.setAttribute('aria-hidden',near_?'false':'true');act.tabIndex=near_?0:-1;if(near_)acs.textContent=clean(near_.name)}
}
act.addEventListener('pointerdown',e=>{e.preventDefault();act.classList.add('p');interact()});
['pointerup','pointerleave','pointercancel'].forEach(t=>act.addEventListener(t,()=>act.classList.remove('p')));
act.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(modal){if(e.key==='Escape')closeModal();return}
  if(e.key==='e'||e.key==='E'||e.key==='Enter'||e.key===' '){e.preventDefault();interact();return}
  if(KM[e.key]){e.preventDefault();held[KM[e.key]]=true}
});
addEventListener('keyup',e=>{if(KM[e.key])held[KM[e.key]]=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false});

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(3,(t-lt)/16.67||1);lt=t;tick++;
  update(dt);render(t);updateChip();updateAct();
}
if(document.fonts&&document.fonts.load)document.fonts.load('700 12px "Be Vietnam Pro"').then(()=>{signSprite=textPx('CHỢ ĐÊM',12,'#ffe9b0','#2a0c08');scene=buildScene()}).catch(()=>{});
requestAnimationFrame(frame);
})();
